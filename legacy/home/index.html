<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kaoru's Studio</title>
<style>
:root{color-scheme:light;--bg:#f7f4fa;--surface:rgba(255,255,255,.74);--text:#211c2a;--muted:#81798c;--line:rgba(75,60,98,.12)}
html[data-theme="night"]{color-scheme:dark;--bg:#0d0b10;--surface:rgba(24,20,30,.78);--text:#f7f2fb;--muted:#a69cad;--line:rgba(232,216,247,.11)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;font-family:Inter,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:
radial-gradient(circle at 15% 5%,rgba(139,92,246,.14),transparent 26rem),
radial-gradient(circle at 85% 28%,rgba(236,72,153,.10),transparent 28rem),
radial-gradient(circle at 52% 100%,rgba(59,130,246,.08),transparent 24rem),var(--bg)}
.home{width:min(1120px,100%);margin:0 auto;padding:clamp(42px,7vw,86px) clamp(20px,5vw,66px) 72px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:38px;margin-bottom:44px}
.kicker{margin:0 0 13px;color:#8b5cf6;font-size:11px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}
h1{margin:0;font:italic 800 clamp(48px,8vw,88px)/.95 Georgia,"Times New Roman",serif;letter-spacing:-.045em}
.hero-copy{max-width:620px;margin:20px 0 0;color:var(--muted);font-size:clamp(14px,2vw,17px);line-height:1.65}
.hero-mark{width:clamp(110px,15vw,178px);aspect-ratio:1;border-radius:34px;padding:18px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(139,92,246,.15),rgba(236,72,153,.12));border:1px solid var(--line);box-shadow:0 24px 70px rgba(70,46,97,.12);transform:rotate(3deg)}
.hero-mark img{width:100%;height:100%;object-fit:contain}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:15px}
.section-head h2{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.section-head span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.card{--card-accent:#8b5cf6;min-height:168px;padding:18px;border:1px solid var(--line);border-radius:22px;background:var(--surface);backdrop-filter:blur(20px);color:var(--text);box-shadow:0 12px 36px rgba(40,25,55,.055);text-align:left;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--card-accent);box-shadow:0 20px 46px rgba(39,24,58,.12);outline:none}
.card-icon{width:42px;height:42px;display:grid;place-items:center;margin-bottom:26px;border-radius:13px;color:var(--card-accent);background:rgba(139,92,246,.08)}
.card-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card strong{display:block;margin-bottom:6px;font-size:14px;font-weight:820}
.card small{display:block;color:var(--muted);font-size:11px;line-height:1.45}
.card[data-studio="text"]{--card-accent:#db4c88}.card[data-studio="image"]{--card-accent:#4f7fd7}.card[data-studio="light"]{--card-accent:#0f9f91}.card[data-studio="3d"]{--card-accent:#7657df}.card[data-studio="combiner"]{--card-accent:#d94d7b}.card[data-studio="gallery"]{--card-accent:#b47722}.card[data-studio="reader"]{--card-accent:#5998D6}
.footer-note{margin:26px 0 0;color:var(--muted);font-size:10px;text-align:center;letter-spacing:.03em}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.home{padding-top:38px}.hero{grid-template-columns:1fr;margin-bottom:34px}.hero-mark{display:none}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{min-height:145px;padding:15px;border-radius:18px}.card-icon{margin-bottom:19px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.card{min-height:124px}}
</style>
<style id="kaoru-home-density">
.home{
  padding:clamp(30px,4.6vw,52px) clamp(20px,5vw,58px) 34px;
}
.hero{
  gap:28px;
  margin-bottom:28px;
}
.kicker{
  margin-bottom:9px;
}
h1{
  font-size:clamp(44px,7vw,74px);
}
.hero-copy{
  margin-top:14px;
  line-height:1.5;
}
.hero-mark{
  width:clamp(100px,12vw,145px);
  padding:15px;
  border-radius:28px;
}
.section-head{
  margin-bottom:10px;
}
.grid{
  gap:11px;
}
.card{
  min-height:145px;
  padding:16px;
  border-radius:20px;
}
.card-icon{
  width:38px;
  height:38px;
  margin-bottom:17px;
}
.footer-note{
  margin-top:16px;
}

@media(max-height:760px) and (min-width:901px){
  .home{
    padding-top:26px;
    padding-bottom:18px;
  }
  .hero{
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(42px,6vw,64px);
  }
  .hero-copy{
    margin-top:10px;
    font-size:14px;
  }
  .hero-mark{
    width:112px;
  }
  .section-head{
    margin-bottom:8px;
  }
  .grid{
    gap:9px;
  }
  .card{
    min-height:128px;
    padding:14px 15px;
  }
  .card-icon{
    width:36px;
    height:36px;
    margin-bottom:12px;
  }
  .footer-note{
    margin-top:10px;
  }
}
</style>
</head>
<body data-studio="home">
<main class="home">
<section class="hero">
<div>
<p class="kicker">Creative workspace</p>
<h1>Kaoru's Studio</h1>
<p class="hero-copy">Un solo espacio para crear, editar, experimentar con luz y color, organizar tus diseños y leer tu biblioteca.</p>
</div>
<div class="hero-mark" aria-hidden="true"><img src="../../logo.png" alt=""></div>
</section>

<div class="section-head"><h2>Studios</h2><span>elige dónde quieres entrar</span></div>

<section class="grid" aria-label="Kaoru Studios">
<button class="card" data-studio="silhouette"><span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 18c2.2-6 4.6-10 8-12 2.1 1.4 4.8 4.4 8 9-4.8-.1-8.4 1-11 4.2C7.4 20.5 5.6 20 4 18Z"/><path d="M9 19.2c2.8-1.8 5.8-2.5 9-2.2"/></svg></span><strong>Silueta Studio</strong><small>Formas, máscaras y composiciones.</small></button>
<button class="card" data-studio="text"><span class="card-icon"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M8 20h8"/></svg></span><strong>Text Studio</strong><small>Tipografía, deformación y efectos.</small></button>
<button class="card" data-studio="image"><span class="card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.2" r="1.5"/><path d="m5 17 4.2-4.2 3.1 3.1 2-2 4.7 3.1"/></svg></span><strong>Image Studio</strong><small>Ajustes, filtros y acabado visual.</small></button>
<button class="card" data-studio="light"><span class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></span><strong>Light Lab</strong><small>Paletas, pieles, luces y materiales.</small></button>
<button class="card" data-studio="3d"><span class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2 20 6.5v9L12 20l-8-4.5v-9L12 2Z"/><path d="m4 6.5 8 4.5 8-4.5M12 11v9"/></svg></span><strong>3D Lighting</strong><small>Modelos, anatomía y estudio de luz.</small></button>
<button class="card" data-studio="combiner"><span class="card-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="11" rx="2"/><rect x="9" y="8" width="11" height="11" rx="2"/></svg></span><strong>Image Combiner</strong><small>Lienzos, capas y composiciones.</small></button>
<button class="card" data-studio="gallery"><span class="card-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><strong>Galería</strong><small>Diseños, proyectos y plantillas.</small></button>
<button class="card" data-studio="reader"><span class="card-icon"><svg viewBox="0 0 24 24"><path d="M5 4.5A3.5 3.5 0 0 1 8.5 2H12v18H8.5A3.5 3.5 0 0 0 5 23.5v-19Z"/><path d="M19 4.5A3.5 3.5 0 0 0 15.5 2H12v18h3.5a3.5 3.5 0 0 1 3.5 3.5v-19Z"/></svg></span><strong>Archive Reader</strong><small>Biblioteca EPUB local, offline y sincronizada.</small></button>
</section>
<p class="footer-note">KAORU'S STUDIO · create at your own pace</p>
</main>

<script>
(function(){
  function applyTheme(theme){
    document.documentElement.dataset.theme = theme === 'night' ? 'night' : 'day';
  }
  window.StudioBridge = { applyTheme:function(theme){ applyTheme(theme); } };
  try{
    if(window.parent && window.parent !== window){
      applyTheme(window.parent.document.documentElement.dataset.theme || 'day');
    }
  }catch(_){}
  document.querySelectorAll('.card[data-studio]').forEach(function(card){
    card.addEventListener('click',function(){
      window.parent.postMessage({type:'kaoru:navigate',studio:card.dataset.studio},'*');
    });
  });
  window.parent.postMessage({type:'kaoru:studio-ready',studio:'home'},'*');
}());
</script>
</body>
</html>
